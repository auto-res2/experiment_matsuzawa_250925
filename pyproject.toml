[project]
name = "curvtrack-exp"
version = "0.1.0"
description = "Re-factored CurvTrack test-time adaptation experiments"
authors = [ {name = "Researcher"} ]
readme = "README.md"
license = {text = "MIT"}
dependencies = [
  "torch>=2.0.0",
  "timm>=0.9.0",
  "torchvision>=0.15.0",
  "PyYAML>=6.0",
  "uv<0.4.0",  # runtime wrapper used in CLI examples
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
