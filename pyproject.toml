[tool.poetry]
name = "common-core-foundation"
version = "0.1.0"
description = "Foundational experimental framework with common logic, evaluation, and infrastructure. Specialised for SQuAD + DialoGPT classification proof-of-concept."
authors = ["AI Researcher <ai@research.org>"]
readme = "README.md"
requires-python = ">=3.9,<3.11"

[tool.poetry.dependencies]
python = ">=3.9,<3.11"
# Core ML stack
torch = "^2.0"
scikit-learn = "^1.3"
# Visualisation
matplotlib = "^3.7"
seaborn = "^0.12"
# Utilities
pyyaml = "^6.0"
tqdm = "^4.66"
# Hugging Face ecosystem (for dataset + config/tokeniser)
transformers = "^4.34"
datasets = "^2.14"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"