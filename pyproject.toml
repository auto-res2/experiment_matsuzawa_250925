[project]
name = "tadp-habls"
version = "0.2.0"
description = "Specialised experiments for TADP-HABLS paper"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torch_geometric>=2.4",
  "ogb>=1.3.6",
  "scikit-learn>=1.3",
  "numpy>=1.25",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "seaborn>=0.12",
  "pyyaml>=6.0",
  "tqdm",
  "pynvml",
  "pyRAPL",
]

[tool.setuptools]
packages = ["src"]
