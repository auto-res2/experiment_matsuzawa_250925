[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haq_gat_experiments"
version = "0.2.0"
description = "Specialised HAQ-GAT experiments with concrete datasets/models"
requires-python = ">=3.10"

# -----------------------------------------------------------------------------
# DEPENDENCIES  – pinned to versions tested on CUDA 12 / PyTorch 2.1
# -----------------------------------------------------------------------------

dependencies = [
    "torch>=2.1.0",
    "torch-geometric>=2.5.0",
    "torch-scatter>=2.1.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.1",
    "codecarbon>=2.3.0",
    "scipy>=1.11.0",
    "datasets>=2.14.0"
]