[build-system]
requires = ["setuptools>=65", "wheel"]

[project]
name = "eco-laseq-experiments"
version = "0.2.0"
description = "Energy-aware GAT experiments (specialised edition)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pynvml>=11.5",
    "datasets>=2.13",
    "transformers>=4.34",
]

[project.optional-dependencies]
develop = ["ipython", "black", "ruff"]
