experiment_name: "smoke_test"

dataset:
  name: "SYNTHETIC_SMOKE"
  num_nodes: 1000
  num_edges: 5000

model:
  name: "HAQGAT"
  in_channels: 16
  hidden_channels: 32
  num_layers: 3
  num_classes: 3
  heads: 2
  K0_init: 4
  m_init: 8

training:
  epochs: 5
  batch_size: 0  # full-batch
  lr: 0.005
  weight_decay: 0.0001
  gamma: 0.001
  epsilon: 0.01
  dropout: 0.2
  qat: false

evaluation:
  save_dir: "results"
  seed: 1
