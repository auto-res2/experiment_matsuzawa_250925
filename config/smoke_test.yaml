description: "Smoke test with FakeData and ResNet-18-FLASH-TTA"
seed: 42

# ---------------- Dataset ----------------
dataset:
  name: "FakeData"
  num_classes: 10
  img_size: 64
  train_size: 500
  val_size: 200
  path: "./data"

transforms:
  resize: 64

# ---------------- Model ----------------
model:
  name: "resnet18"
  pretrained: false
  num_classes: 10
  method: "flash_tta"
  proj_dim: 8
  gru_hidden: 64

# ---------------- Training ----------------
training:
  epochs: 2
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  optimizer: "adam"

# ---------------- Evaluation ----------------
evaluation:
  batch_size: 64

output_dir: "runs/smoke_test"
figures_dir: "figures"
